name: entropy_hist
description: >-
  Per-file history for notes, standing alone: the `vault_hist` library
  (snapshots + forward patches, sha256-linked, multi-writer) and the `hist`
  command line over it — a local git-lite for notes over a bare folder:
  commit, log, show, restore, diff, blame, status, and deliberate
  reconciliation of divergent lines. No daemon, no server, no credentials.
  Implements the `vault_hist` and `vault_hist_cli` specs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

executables:
  hist:

dependencies:
  args: ^2.5.0
  crypto: ^3.0.0
  diff_match_patch: ^0.4.1
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
